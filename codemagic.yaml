workflows:
  ios-workflow:
    name: VBA Desk iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Matches the existing "Ikonet Solutions" API key under Codemagic ->
      # Personal Account settings -> Integrations -> Developer Portal.
      app_store_connect: Ikonet Solutions
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.konechoco.vbadesk
      groups:
        # VITE_LEVELPLAY_APP_KEY_IOS, VITE_LEVELPLAY_BANNER_AD_UNIT_ID_IOS,
        # VITE_LEVELPLAY_INTERSTITIAL_AD_UNIT_ID_IOS, VITE_LEVELPLAY_REWARDED_AD_UNIT_ID_IOS
        # (Unity LevelPlay dashboard > VBA Desk iOS). Without them ads stay off.
        - levelplay
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        VITE_ADS_TEST_MODE: "false"
        VITE_PRIVACY_POLICY_URL: "https://konechoco.github.io/vba-desk/#/privacy"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync web assets + plugins into the iOS project
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - konechoco@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-workflow:
    name: VBA Desk Android (debug build only)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.konechoco.vbadesk"
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync web assets + plugins into the Android project
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd $CM_BUILD_DIR/android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - konechoco@gmail.com
        notify:
          success: true
          failure: true
